<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regime Severe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7f4;
      text-align: center;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 35px 20px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      padding: 25px;
    }

    .card {
      background: white;
      margin: 15px auto;
      padding: 20px;
      border-radius: 15px;
      max-width: 400px;
      box-shadow: 0 3px 10px #ddd;
    }

    button {
      background: #2e7d32;
      color: white;
      border: 0;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Regime Severe</h1>
  <p>نظام غذائي متوازن لصحة أفضل</p>
</header>

<div class="container">

  <div class="card">
    <h2>🍎 الوجبات</h2>
    <p>اقتراحات لوجبات متوازنة خلال اليوم.</p>
    <button onclick="showMessage()">ابدأ</button>
  </div>

  <div class="card">
    <h2>💧 الماء</h2>
    <p>تذكير بشرب الماء خلال اليوم.</p>
  </div>

  <div class="card">
    <h2>🏃 النشاط</h2>
    <p>حركة يومية مناسبة لصحة أفضل.</p>
  </div>

</div>

<script>
function showMessage() {
  alert("مرحبا بك في Regime Severe!");
}
</script>

</body>
</html>
