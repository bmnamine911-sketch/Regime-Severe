
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥗 Regime Severe</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f8e9;
  color:#222;
}

header{
  background:#43a047;
  color:white;
  text-align:center;
  padding:25px 10px;
}

header h1{
  margin:0;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

nav button{
  border:0;
  padding:12px 16px;
  border-radius:20px;
  background:#e8f5e9;
  color:#2e7d32;
  font-size:16px;
}

main{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:18px;
  box-shadow:0 3px 10px #ccc;
}

.card h2{
  color:#2e7d32;
}

.meal{
  padding:15px;
  margin:10px 0;
  background:#f5fff5;
  border-right:5px solid #4caf50;
  border-radius:10px;
}

.water{
  text-align:center;
}

.water-number{
  font-size:40px;
  color:#1976d2;
  margin:20px;
}

button.action{
  border:0;
  background:#1976d2;
  color:white;
  padding:14px 25px;
  border-radius:25px;
  font-size:17px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<header>
<h1>🥗 Regime Severe</h1>
<p>غذاء متوازن وصحة أفضل</p>
</header>

<nav>
<button onclick="openPage('home')">🏠 الرئيسية</button>
<button onclick="openPage('meals')">🍽️ الوجبات</button>
<button onclick="openPage('water')">💧 الماء</button>
<button onclick="openPage('sport')">🏃 النشاط</button>
</nav>

<main>

<div id="home" class="page active">

<div class="card">
<h2>👋 مرحبا</h2>
<p id="date">جاري التحميل...</p>
<p>مرحبا بك في تطبيق Regime Severe.</p>
</div>

<div class="card">
<h2>🏃 نشاط اليوم</h2>
<p id="homeSport">جاري التحميل...</p>
</div>

</div>


<div id="meals" class="page">

<div class="card">
<h2>🍽️ وجبات اليوم</h2>
<p id="mealTitle"></p>
<div id="mealList"></div>
</div>

</div>


<div id="water" class="page">

<div class="card water">

<h2>💧 الماء</h2>

<p>سجل كل مرة شربتي فيها الماء.</p>

<div class="water-number">
<span id="waterNumber">0</span> 💧
</div>

<button class="action" onclick="drinkWater()">
+ شربت الماء
</button>

</div>

</div>


<div id="sport" class="page">

<div class="card">

<h2>🏃 نشاط اليوم</h2>

<h3 id="sportText">
جاري التحميل...
</h3>

<p>
اختار النشاط اللي كيعجبك وخليه ممتع وآمن.
</p>

</div>

</div>

</main>

<footer>
🥗 Regime Severe
</footer>


<script>

function openPage(id){

document.querySelectorAll(".page").forEach(function(page){
page.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}


const days=[
"الأحد",
"الاثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"
];

const day=new Date().getDay();

document.getElementById("date").textContent=
"📅 اليوم: "+days[day];

document.getElementById("mealTitle").textContent=
"وجبات يوم "+days[day];


const sports=[
"🚶 المشي الخفيف",
"⚽ لعب كرة القدم",
"🚲 ركوب الدراجة في مكان آمن",
"🏀 لعب كرة السلة",
"🎵 الرقص والحركة على الموسيقى",
"🏃 حركة خفيفة",
"🧹 المساعدة في الأعمال المنزلية"
];

document.getElementById("sportText").textContent=
sports[day];

document.getElementById("homeSport").textContent=
sports[day];


const meals=[

[
"🍳 الفطور: بيض + خبز كامل + فاكهة",
"🍎 وجبة خفيفة: فاكهة + ياغورت",
"🍗 الغداء: دجاج + أرز + خضر",
"🥛 العشاء: ياغورت + خبز + خضر"
],

[
"🥛 الفطور: حليب + خبز + فاكهة",
"🍎 وجبة خفيفة: فاكهة",
"🐟 الغداء: سمك + بطاطس + خضر",
"🥚 العشاء: بيض + خبز + خضر"
],

[
"🍳 الفطور: بيض + خبز + فاكهة",
"🥛 وجبة خفيفة: ياغورت",
"🍲 الغداء: عدس + خبز + سلطة",
"🥗 العشاء: سلطة + جبن + خبز"
],

[
"🥣 الفطور: ياغورت + فاكهة + خبز",
"🍎 وجبة خفيفة: فاكهة",
"🍗 الغداء: دجاج + بطاطس + خضر",
"🥛 العشاء: حليب أو ياغورت + خبز"
],

[
"🍳 الفطور: بيض + خبز + فاكهة",
"🥛 وجبة خفيفة: ياغورت",
"🐟 الغداء: سمك + أرز + خضر",
"🥗 العشاء: سلطة + خبز + جبن"
],

[
"🥛 الفطور: حليب + خبز + فاكهة",
"🍎 وجبة خفيفة: فاكهة + ياغورت",
"🍲 الغداء: لوبيا أو عدس + خضر",
"🥚 العشاء: بيض + خضر + خبز"
],

[
"🥣 الفطور: ياغورت + فاكهة + خبز",
"🍎 وجبة خفيفة: فاكهة",
"🍗 الغداء: دجاج + أرز + خضر",
"🥛 العشاء: ياغورت + فاكهة + خبز"
]

];


const mealList=document.getElementById("mealList");

meals[day].forEach(function(meal){

const div=document.createElement("div");

div.className="meal";

div.textContent=meal;

mealList.appendChild(div);

});


const today=
new Date().toISOString().slice(0,10);

let savedDay=
localStorage.getItem("waterDay");

let water=
Number(localStorage.getItem("water"))||0;

if(savedDay!==today){

water=0;

localStorage.setItem("waterDay",today);
localStorage.setItem("water","0");

}

document.getElementById("waterNumber").textContent=water;


function drinkWater(){

water++;

localStorage.setItem("water",water);
localStorage.setItem("waterDay",today);

document.getElementById("waterNumber").textContent=water;

}

</script>

</body>
</html>
